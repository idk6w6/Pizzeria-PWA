<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#450a0a" />
    <title>Sin conexion | PIZZA'S LEO</title>
    <style>
      :root { color-scheme: dark; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #0a0a0a;
        color: #fafafa;
        font-family: Arial, sans-serif;
        text-align: center;
      }
      main { max-width: 460px; }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #450a0a;
        color: #fbbf24;
        font-size: 38px;
      }
      h1 { margin: 0 0 12px; }
      p { margin: 0 0 24px; color: #a3a3a3; line-height: 1.6; }
      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
        background: #b91c1c;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      a {
        border-radius: 999px;
        padding: 12px 20px;
        background: #f59e0b;
        color: #450a0a;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">P</div>
      <h1>Sin conexion</h1>
      <p>No pudimos cargar esta pagina. Revisa tu conexion y vuelve a intentarlo.</p>
      <div class="actions">
        <a href="/producto">Ver productos</a>
        <button type="button" onclick="location.reload()">Reintentar</button>
      </div>
    </main>
  </body>
</html>
